[meta]
config_version=8

[mod]
enabled=1

[units]
; GET_CAR_SPEED is treated as metres per second by default.
; Change this value in hundredths if a specific DE build needs calibration.
speed_multiplier_x100=360
max_display_speed_kmh=240

[speed]
smoothing_percent=14
update_interval_ms=40
; Positive speed increase that fills the acceleration bar completely.
acceleration_redline_kmh_per_second=80
neutral_speed_kmh_x100=80
reverse_min_speed_kmh=3
reverse_dot_threshold_percent=35

[animation]
duration_ms=220

[visual]
show_direction=1

[layout]
; Normalized native HUD coordinates (0..1). The compact widget occupies the
; lower-right safe area and scales with the game HUD on ultrawide displays.
anchor_x_percent=955
anchor_y_percent=810
unit_offset_y_percent=45
lower_offset_y_percent=105
speed_text_scale_x100=110
unit_text_scale_x100=36
drive_text_scale_x100=46
bar_width_percent=95
bar_height_percent=7
bar_gap_percent=4
bar_segments=12
font=3

[input]
reload_hotkey_enabled=1

[debug]
enabled=0
