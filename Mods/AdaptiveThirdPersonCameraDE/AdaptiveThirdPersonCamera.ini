[meta]
config_version=1

[mod]
enabled=1

[camera]
manual_override=1
manual_override_threshold=24
manual_free_ms=1500
manual_blend_ms=850
recenter_low_speed_ms=2600
recenter_normal_speed_ms=1450
recenter_high_speed_ms=700
anchor_transition_ms=280
collision_enabled=1
collision_probe_radius_cm=22
collision_update_ms=33
collision_safety_margin_cm=20
collision_emergency_distance_cm=145
position_frequency_hz_x100=460
position_damping_ratio_percent=100
vertical_tracking_percent=58
airborne_vertical_tracking_percent=23
target_frequency_hz_x100=500
target_damping_ratio_percent=100
collision_frequency_hz_x100=800
collision_damping_ratio_percent=100

[vehicle]
; 0 = dynamic scripted camera + v29 smooth native mouse bridge (recommended).
;     Vehicle free-look handoffs are sticky and rate-limited to prevent pops.
; 1 = fully native GTA fallback.
native_camera_backend=0
; Dynamic FOV/profile effects are now also applied with the native backend.
native_dynamic_fov=1
; Adds quantized speed/drift/acceleration/airborne changes to native 09EF tweak.
native_contextual_tweak=1
drift_velocity_influence_percent=28
drift_min_speed_kmh=22
drift_distance_cm=35
drift_fov_boost_deg_x10=20
acceleration_fov_boost_deg_x10=24
braking_fov_reduction_deg_x10=12
yaw_follow_delay_ms=180
yaw_follow_strength_percent=62
max_steering_yaw_bias_deg=4
velocity_direction_threshold_cms=35
reverse_min_speed_kmh=3
reverse_enter_hold_ms=280
reverse_exit_hold_ms=420
reverse_exit_speed_kmh=4
acceleration_filter_percent=12
airborne_enter_vertical_kmh=9
airborne_exit_vertical_kmh=4
landing_min_airborne_ms=180
landing_duration_ms=220

[on_foot]
; 0 = dynamic scripted shoulder camera + native mouse bridge (recommended).
;     Native GTA free-look is used during active mouse movement, then the mod
;     smoothly reacquires the same orbit.
; 1 = fully native GTA fallback for troubleshooting.
native_camera_backend=0
; Used only by the native fallback.
native_dynamic_fov=1
; The values below are still used for FOV and by the optional scripted backend.
; v28 uses these values in the default scripted backend.
shoulder_offset_cm=34
sprint_shoulder_offset_cm=20
turn_look_cm=65
sprint_turn_look_cm=105
idle_distance_cm=345
idle_height_cm=160
idle_fov_deg=72
walk_distance_cm=365
walk_height_cm=158
walk_fov_deg=74
jog_distance_cm=400
jog_height_cm=153
jog_fov_deg=76
sprint_distance_cm=440
sprint_height_cm=148
sprint_fov_deg=79

[aim]
