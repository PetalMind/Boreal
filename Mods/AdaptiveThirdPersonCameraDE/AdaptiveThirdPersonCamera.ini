; Driving-only v40. Distances: cm; FOV: degrees; time: ms.
; F9 toggle, F11 reload, F5/V vehicle distance.
; FOV is applied only when public API readback confirms support.
[meta]
config_version=2

[mod]
enabled=1

[camera]
manual_override=1
manual_override_threshold=24
manual_free_ms=1100
manual_blend_ms=900
recenter_low_speed_ms=2200
recenter_normal_speed_ms=1300
recenter_high_speed_ms=900
anchor_transition_ms=280
collision_enabled=1
collision_probe_radius_cm=22
collision_update_ms=33
collision_safety_margin_cm=20
collision_emergency_distance_cm=145
position_frequency_hz_x100=440
position_damping_ratio_percent=100
vertical_tracking_percent=50
airborne_vertical_tracking_percent=22
target_frequency_hz_x100=650
target_damping_ratio_percent=100
collision_frequency_hz_x100=800
collision_damping_ratio_percent=100

[vehicle]
; WD2-inspired road framing. 0 = scripted; 1 = native GTA fallback.
; No on-foot or aiming camera effects are supported.
manual_auto_recenter=1
; World yaw-rate prediction, bounded as a complete lateral target offset.
corner_preview_ms=480
corner_preview_max_deg=18
corner_target_max_offset_cm=120
native_camera_backend=0
native_dynamic_fov=1
native_contextual_tweak=1
drift_velocity_influence_percent=28
drift_min_speed_kmh=22
drift_distance_cm=25
drift_fov_boost_deg_x10=12
acceleration_fov_boost_deg_x10=18
braking_fov_reduction_deg_x10=8
yaw_follow_delay_ms=150
yaw_follow_strength_percent=85
max_steering_yaw_bias_deg=3
manual_corner_preview_percent=0
velocity_direction_threshold_cms=35
reverse_min_speed_kmh=3
reverse_enter_hold_ms=280
reverse_exit_hold_ms=420
reverse_exit_speed_kmh=4
acceleration_filter_percent=12
airborne_enter_vertical_kmh=9
airborne_exit_vertical_kmh=4
landing_min_airborne_ms=180
landing_duration_ms=220

[car]
slow_distance_cm=525
slow_height_cm=185
slow_fov_deg=74
normal_distance_cm=565
normal_height_cm=190
normal_fov_deg=78
fast_distance_cm=595
