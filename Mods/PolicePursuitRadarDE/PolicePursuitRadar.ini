[meta]
config_version=1

[mod]
; 1 = mod active.
enabled=1

[tracking]
max_distance_m=420
scan_interval_ms=450
discovery_interval_ms=1200
lost_sight_delay_ms=1200
contact_memory_ms=1100
unit_eviction_ttl_ms=4200
wanted_zero_grace_ms=800
max_tracked_units=16

[search]
radius_base_m=55
radius_per_star_m=25

[blips]
; Wszystko jest rysowane na oryginalnej minimapie GTA. Nie ma dodatkowego HUD-u.
show_foot=1
show_cars=1
show_bikes=1
show_boats=1
show_helicopters=1

; Krótki punkt przed jednostką pokazuje kierunek ruchu/patrzenia.
show_direction_blips=1
direction_marker_distance_m=12
direction_update_distance_m=8
direction_update_interval_ms=900
max_direction_blips=4

; Ostatnia znana pozycja + strefa poszukiwań na natywnej minimapie.
show_search_location=1
search_location_scale=2
show_search_area=1
search_area_max_blips=10
; Jeden większy punkt przesuwa się po obwodzie, dając subtelny efekt skanowania.
search_area_sweep=1
search_area_sweep_interval_ms=450

; Main police contacts are coordinate blips, never entity-attached blips.
native_blip_update_distance_m=5
native_blip_update_interval_ms=700
max_native_blips=12
show_native_blips=1

[visual]
debug=0

[input]
; F6 reloads the INI while the game is running.
reload_hotkey_enabled=1
