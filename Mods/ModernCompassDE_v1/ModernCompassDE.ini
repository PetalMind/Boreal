[meta]
config_version=1

[mod]
; 1 = enabled on startup
; Runtime toggle: F7 by default
enabled=1

[layout]
; GTA script HUD uses a 640x448 virtual canvas.
; Defaults are intentionally compact and tuned for ultrawide displays.
width=168
height=27
center_x=320
top_y=18
; Degrees visible to each side of camera direction.
visible_half_angle=72
; Tick spacing. 15 = clean modern look without clutter.
minor_step_deg=15

[motion]
; Exponential smoothing time constant. Lower = more responsive.
smoothing_ms=72

[visual]
; Fade begins at this percentage of distance from center to edge.
edge_fade_start_percent=62
background_alpha=38
border_alpha=45
tick_alpha=150
label_alpha=220
center_alpha=245

[colors]
; Cool neutral palette with a very subtle blue-white accent.
accent_r=205
accent_g=235
accent_b=245
text_r=238
text_g=244
text_b=248

[text]
scale_x_percent=28
scale_y_percent=78

[features]
show_minor_ticks=1
show_cardinal_labels=1
; Optional numeric heading (000-359) below the bar.
show_degree_readout=0

[input]
; Windows virtual-key codes.
; F7 = 118, F8 = 119.
toggle_vk=118
reload_vk=119

[debug]
enabled=0
