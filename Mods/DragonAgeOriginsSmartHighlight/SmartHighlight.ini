[smart_highlight]
; 1 = helper przechwytuje TAB i przełącza stan podświetlania.
enabled=1
; 1 = przy starcie synchronizuj sekcję AutoHighlightOptions w DragonAge.ini.
sync_auto_highlight=1
; TAB, F6, F7, F8, ... lub liczba VK w zapisie dziesiętnym.
toggle_key=TAB

[auto_highlight]
; Auto Highlight pokazuje placeables/interaktywne obiekty natywnie.
; Ta opcja steruje dodatkowo widocznością NPC.
show_npcs=0
show_hero=0
show_followers=0
; 1 pokazuje również wewnętrzne tagi zasobów pod nazwą obiektu.
show_tags=0
; Zasięg w metrach. Auto Highlight odświeża listę po tym dystansie.
range_m=20
refresh_s=45
