[meta]
config_version=1

[mod]
; 1 = mod active, 0 = disable blood and regeneration.
enabled=1

[blood]
; Procedural blood overlay. No external game texture and no UE4 memory patch.
enabled=1

; Blood remains stable for this time before it starts fading.
fade_delay_ms=3500
; Smooth fade duration after fade_delay_ms.
fade_ms=15000

; Short, subtle impact tint after real health damage.
pulse_duration_ms=360

; Maximum event stains retained at once.
max_stains=9
; Hard rendering budget per frame. Keep this bounded for SA:DE stability.
draw_budget=80

; Very subtle injured-screen wash. 0 disables it.
full_screen_alpha=12
; Strength of the low-health edge vignette.
edge_alpha=145

; Minimum health loss required to create blood, stored in tenths.
; 5 = 0.5 HP. Armour-only hits never create blood.
min_health_damage_x10=5

; Rapid damage ticks inside this window are merged into the latest stain.
; This prevents automatic-fire / repeated-damage effect spam.
stain_cooldown_ms=95

; Maximum number of small satellite droplets per splash.
max_satellite_drops=5

[regeneration]
; 1 = restore health automatically after the delay.
enabled=1
; Time without ANY damage (health or armour) before healing begins.
delay_ms=5000
; Health restored each second, stored in tenths for INI precision.
health_per_second_x10=80
; Used when GET_CHAR_MAX_HEALTH is not exposed by the installed definitions.
; If CJ later reaches a higher real value, the observed value becomes the ceiling.
fallback_health_ceiling=100

[debug]
enabled=0
