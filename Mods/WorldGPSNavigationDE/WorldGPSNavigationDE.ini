[meta]
config_version=1

[mod]
; 1 = mod active.
enabled=1
; 1 = hide world guidance while CJ is on foot.
hide_when_on_foot=1

[route]
; The marker trail is local to the vehicle and is extended with speed.
base_visible_distance_m=62
max_visible_distance_m=128
speed_distance_gain_m_per_kmh_x100=38
marker_spacing_m=9
rebuild_interval_ms=700
rebuild_distance_m=8
max_node_search_distance_m=32
node_search_count=5

[visual]
show_destination_marker=1
show_turn_text=1
show_distance_text=1

[manual_target]
; SA:DE builds whose CLEO runtime does not expose waypoint getters can use
; a fixed target as a diagnostic fallback. Set enabled=1 and edit x/y/z.
; F7 captures a point 60 m ahead of the vehicle into the running script only.
enabled=0
x=0
y=0
z=0

[input]
; F11 reloads this INI while the game is running.
reload_hotkey_enabled=1

[debug]
enabled=0
